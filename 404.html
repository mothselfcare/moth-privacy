<title>Page not found | Moth</title><style>:root{--cream:#f7f1e7;--ink:#40372f;--muted:#786b61;--line:#ddd1c1;--moss:#596552}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#f8f3eb 0,#f5eee4 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{position:relative;overflow:hidden;width:min(620px,calc(100% - 28px));padding:50px 34px;text-align:center;border:1px solid var(--line);border-radius:28px;background:rgba(255,250,242,.9);box-shadow:0 18px 46px rgba(72,57,45,.06)}.lost-firefly{position:absolute;right:15%;top:18%;width:6px;height:6px;border-radius:50%;background:#d6aa62;box-shadow:0 0 6px #e7c37f,0 0 16px rgba(214,170,98,.75);animation:lostFirefly 4.8s ease-in-out infinite;pointer-events:none}@keyframes lostFirefly{0%,100%{transform:translate(0,0);opacity:.35}28%{transform:translate(-18px,10px);opacity:.9}58%{transform:translate(7px,25px);opacity:.5}82%{transform:translate(-8px,-6px);opacity:.82}}img{width:112px;height:112px;object-fit:contain;-webkit-user-drag:none;user-select:none}.eyebrow{color:var(--moss);font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,8vw,56px);font-weight:500;line-height:1.04;margin:8px 0 14px}p{color:var(--muted);font-size:17px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 21px;margin-top:14px;border-radius:17px;background:var(--moss);color:#fffaf3;text-decoration:none;font-size:14px;font-weight:750}a:focus-visible{outline:2px solid #9f7c50;outline-offset:3px}@media(prefers-reduced-motion:reduce){.lost-firefly{animation:none;opacity:.65}}
.theme-toggle{position:absolute;right:14px;top:14px;width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:rgba(255,250,244,.5);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;touch-action:manipulation;box-shadow:inset 0 1px rgba(255,255,255,.34);z-index:2}

</style><script src="/seasonal.js?v=1" defer></script>\n</head><body><main class="card"><button class="theme-toggle" type="button" aria-label="switch to dark mode" aria-pressed="false" title="switch to dark mode"></button><span class="lost-firefly" aria-hidden="true"></span><img src="/assets/moth-icon-final.webp?v=2" alt="" draggable="false"><p class="eyebrow">lost little firefly</p><h1>this page wandered off.</h1><p>Looks like this little light took a wrong turn. You can head back to Moth from here.</p><a class="btn" href="/">back to Moth</a></main><script>
(()=>{const root=document.documentElement;const button=document.querySelector(".theme-toggle");const meta=document.querySelector('meta[name="theme-color"]');const media=window.matchMedia("(prefers-color-scheme: dark)");
const savedTheme=()=>{try{return localStorage.getItem("moth-theme")}catch{return null}};
const applyTheme=(theme,persist)=>{root.dataset.theme=theme;root.style.colorScheme=theme;if(meta)meta.content=theme==="dark"?"#201c19":(meta.dataset.light||"#f7f1e7");if(button){const dark=theme==="dark";button.setAttribute("aria-pressed",String(dark));button.setAttribute("aria-label",dark?"switch to light mode":"switch to dark mode");button.setAttribute("title",dark?"switch to light mode":"switch to dark mode")}if(persist)try{localStorage.setItem("moth-theme",theme)}catch{}};
applyTheme(root.dataset.theme||((savedTheme()==="dark"||savedTheme()!=="light"&&media.matches)?"dark":"light"),false);
if(button)button.addEventListener("click",()=>applyTheme(root.dataset.theme==="dark"?"light":"dark",true));
const followSystem=e=>{if(!savedTheme())applyTheme(e.matches?"dark":"light",false)};
if(media.addEventListener)media.addEventListener("change",followSystem);else if(media.addListener)media.addListener(followSystem);
})();
</script>

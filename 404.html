<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f1e7"><meta name="robots" content="noindex"><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><title>Page not found | Moth</title><style>:root{--cream:#f7f1e7;--ink:#40372f;--muted:#786b61;--line:#ddd1c1;--moss:#596552}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#f8f3eb 0,#f5eee4 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{position:relative;overflow:hidden;width:min(620px,calc(100% - 28px));padding:50px 34px;text-align:center;border:1px solid var(--line);border-radius:28px;background:rgba(255,250,242,.9);box-shadow:0 18px 46px rgba(72,57,45,.06)}.lost-firefly{position:absolute;right:15%;top:18%;width:6px;height:6px;border-radius:50%;background:#d6aa62;box-shadow:0 0 6px #e7c37f,0 0 16px rgba(214,170,98,.75);animation:lostFirefly 4.8s ease-in-out infinite;pointer-events:none}@keyframes lostFirefly{0%,100%{transform:translate(0,0);opacity:.35}28%{transform:translate(-18px,10px);opacity:.9}58%{transform:translate(7px,25px);opacity:.5}82%{transform:translate(-8px,-6px);opacity:.82}}img{width:112px;height:112px;object-fit:contain;-webkit-user-drag:none;user-select:none}.eyebrow{color:var(--moss);font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,8vw,56px);font-weight:500;line-height:1.04;margin:8px 0 14px}p{color:var(--muted);font-size:17px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 21px;margin-top:14px;border-radius:17px;background:var(--moss);color:#fffaf3;text-decoration:none;font-size:14px;font-weight:750}a:focus-visible{outline:2px solid #9f7c50;outline-offset:3px}@media(prefers-reduced-motion:reduce){.lost-firefly{animation:none;opacity:.65}}</style></head><body><main class="card"><span class="lost-firefly" aria-hidden="true"></span><img src="/assets/moth-icon-final.webp?v=2" alt="" draggable="false"><p class="eyebrow">lost little firefly</p><h1>this page wandered off.</h1><p>Looks like this little light took a wrong turn. You can head back to Moth from here.</p><a class="btn" href="/">back to Moth</a></main></body></html>
